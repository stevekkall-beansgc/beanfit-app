<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1240" viewBox="0 0 980 1240" role="img" aria-labelledby="title desc">
<title id="title">BeanFit App: Pair a device across a visible data boundary.</title>
<desc id="desc">On the device BeanFit detects hardware and computes estimates. Pairing sends a sanitized profile and optional recommendation snapshot to a Cloudflare Worker, which stores pending data in D1 before browser approval. Server-rendered pages and authenticated approval link the device to an account; denied linking is distinct from deletion. Device credentials are stored hashed and returned through a separate CLI handoff.</desc>
