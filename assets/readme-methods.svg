<text x="60" y="779" font-size="27" font-weight="700" fill="#245fa5" text-anchor="start">Review the pending device and pairing code</text>
<text x="60" y="823" font-size="22" font-weight="400" fill="#152d45" text-anchor="start">Codes expire after 15 minutes. A person approves or denies account linking.</text>
<rect x="38" y="906" width="438" height="184" rx="16" fill="#eaf6f2" stroke="#d6e2ec" stroke-width="2"/>
