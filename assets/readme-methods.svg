<text x="60" y="936" font-size="24" font-weight="700" fill="#0e756a" text-anchor="start">Approve</text>
<text x="60" y="976.6" font-size="21" font-weight="400" fill="#152d45" text-anchor="start">Guarded account-link update</text>
<text x="60" y="1012" font-size="21" font-weight="400" fill="#152d45" text-anchor="start">Credential returned to the CLI</text>
<text x="60" y="1047.4" font-size="21" font-weight="400" fill="#152d45" text-anchor="start">Stored hash clears on revocation</text>
<rect x="504" y="906" width="438" height="184" rx="16" fill="#fff4e7" stroke="#d6e2ec" stroke-width="2"/>
<rect x="504" y="922" width="5" height="152" rx="2" fill="#995017"/>
<text x="526" y="936" font-size="24" font-weight="700" fill="#995017" text-anchor="start">Deny / expire</text>
<text x="526" y="976.6" font-size="21" font-weight="400" fill="#152d45" text-anchor="start">No account link is granted</text>
<text x="526" y="1012" font-size="21" font-weight="400" fill="#152d45" text-anchor="start">No instant-deletion promise</text>
<text x="526" y="1047.4" font-size="21" font-weight="400" fill="#152d45" text-anchor="start">Cleanup has a separate policy</text>
<polyline points="258,860 258,905" fill="none" stroke="#0e756a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="723,860 723,905" fill="none" stroke="#995017" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="38" y="1128" font-size="23" font-weight="700" fill="#152d45" text-anchor="start">No client framework. Stored snapshots—not delivered catalog-update alerts.</text>
<polyline points="38,1134 942,1134" fill="none" stroke="#d5e0ea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="38" y="1164" font-size="20" font-weight="400" fill="#4e6276" text-anchor="start">Bean Sched owns recurring retention calls; the Worker has no cleanup cron.</text>
<text x="38" y="1192" font-size="20" font-weight="400" fill="#4e6276" text-anchor="start">This source architecture does not establish a public demo or current deployment health.</text>
